<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" shape-rendering="geometricPrecision">
  <!-- Mint background with rounded corners -->
  <rect x="0" y="0" width="180" height="180" rx="36" ry="36" fill="#c4dfd0"/>

  <!-- Left page -->
  <path d="M22 48 L88 52 L88 150 L22 146 Z" fill="#fbf8f0" stroke="#3d2817" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right page -->
  <path d="M158 48 L92 52 L92 150 L158 146 Z" fill="#fbf8f0" stroke="#3d2817" stroke-width="3" stroke-linejoin="round"/>
  <!-- Coral spine -->
  <rect x="88" y="48" width="4" height="102" fill="#e88966" stroke="#3d2817" stroke-width="3" stroke-linejoin="round"/>

  <!-- Ink lines on left page (simulating text) -->
  <line x1="32" y1="72" x2="82" y2="74" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="86" x2="78" y2="88" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="100" x2="82" y2="102" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="114" x2="72" y2="116" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="128" x2="80" y2="130" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ink lines on right page -->
  <line x1="98" y1="74" x2="148" y2="72" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="102" y1="88" x2="148" y2="86" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="98" y1="102" x2="148" y2="100" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="108" y1="116" x2="148" y2="114" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="130" x2="148" y2="128" stroke="#3d2817" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mint bookmark ribbon hanging from top of right page -->
  <path d="M118 48 L134 48 L134 80 L126 72 L118 80 Z" fill="#c4dfd0" stroke="#3d2817" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
